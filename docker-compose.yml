services:
  tunadesk:
    build: .
    ports:
      - "4545:4545"
    environment:
      TUNADESK_ADMIN_TOKEN: ${TUNADESK_ADMIN_TOKEN:?set TUNADESK_ADMIN_TOKEN}
      TUNADESK_PUBLIC_URL: ${TUNADESK_PUBLIC_URL:-http://localhost:4545}
    volumes:
      - tunadesk-data:/data
    restart: unless-stopped
volumes:
  tunadesk-data:
